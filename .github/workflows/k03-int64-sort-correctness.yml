name: K03 64-bit Subrange Sort Correctness (Research)

on:
  push:
    branches: ["research/k03-int64-sort-precision-20261118"]
    paths:
      - "sort_k03/**"
      - ".github/workflows/k03-int64-sort-correctness.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: k03-sort-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-sort-reproducer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    name: "${{ matrix.compiler }} / Serial public API"
    steps:
      - name: Checkout independent Research probe
        uses: actions/checkout@v4

      - name: Checkout pinned unmodified upstream
        uses: actions/checkout@v4
        with:
          repository: kokkos/kokkos
          ref: e9e05d0ec9fd9ed215d761c34bc0dc42ee4248c1
          path: kokkos
          submodules: recursive
          persist-credentials: false

      - name: Configure Kokkos Serial backend
        run: |
          cmake -S kokkos -B build/kokkos \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install" \
            -DKokkos_ENABLE_SERIAL=ON \
            -DKokkos_ENABLE_OPENMP=OFF \
            -DKokkos_ENABLE_TESTS=OFF \
            -DKokkos_ENABLE_EXAMPLES=OFF
          cmake --build build/kokkos --parallel 2
          cmake --install build/kokkos

      - name: Build sanitised public sort probe
        run: |
          cmake -S sort_k03 -B build/k03 \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/install"
          cmake --build build/k03 --parallel 2

      - name: Verify ordinary int64 subrange and full-range sorting
        run: ./build/k03/k03_sort_probe --controls

      - name: Observe lossy double mapping without assuming a sanitizer trap
        env:
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: |
          ./build/k03/k03_sort_probe --bin-diagnostic
          echo "Integer adjacent values at 2^53 map to an equal double value." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify fall-back sorter control with ordinary integers
        run: |
          ./build/k03/k03_sort_probe --fallback-control > control.log 2>&1
          cat control.log
          grep -F "K03_FALLBACK_CONTROL_SORTED" control.log

      - name: Check silent wrong order in production fallback implementation
        run: |
          ./build/k03/k03_sort_probe --fallback-high > fallback.log 2>&1
          cat fallback.log
          grep -F "K03_FALLBACK_SILENT_WRONG_ORDER" fallback.log
          echo "Internal fallback BinSort: ordinary int64 inputs near 2^53 remain reversed (verified wrong output, no crash)." >> "$GITHUB_STEP_SUMMARY"

      - name: Compare public Serial subrange API behavior (independent path)
        run: |
          ./build/k03/k03_sort_probe --subrange > subrange.log 2>&1
          cat subrange.log
          grep -F "K03_SORT_RESULT_CORRECT" subrange.log
          echo "Public Serial subrange sorts within bins and is correct for this input; do not conflate it with the full-range fallback." >> "$GITHUB_STEP_SUMMARY"
