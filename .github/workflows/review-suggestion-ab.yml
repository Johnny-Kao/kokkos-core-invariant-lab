name: Review 9725 Consolidated Candidate Validation
on:
  push:
    paths:
      - ".github/workflows/review-suggestion-ab.yml"
      - "review_audit/**"
  workflow_dispatch:
jobs:
  reviewer-ab:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: g++
            backend: SERIAL
          - compiler: clang++
            backend: SERIAL
          - compiler: g++
            backend: OPENMP
          - compiler: g++
            backend: THREADS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kokkos/kokkos
          ref: 1e08552799ab366f3037ce7ad46cc8d3ca85498d
          path: kokkos
          submodules: recursive
          persist-credentials: false
      - name: Build pinned Kokkos baseline libraries once per backend
        shell: bash
        run: |
          cmake -S kokkos -B build/kokkos -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install" \
            -DKokkos_ENABLE_SERIAL=${{ matrix.backend == 'SERIAL' && 'ON' || 'OFF' }} \
            -DKokkos_ENABLE_OPENMP=${{ matrix.backend == 'OPENMP' && 'ON' || 'OFF' }} \
            -DKokkos_ENABLE_THREADS=${{ matrix.backend == 'THREADS' && 'ON' || 'OFF' }} \
            -DKokkos_ENABLE_TESTS=OFF -DKokkos_ENABLE_EXAMPLES=OFF
          cmake --build build/kokkos --parallel 2
          cmake --install build/kokkos
      - name: Generate isolated header variants using exact reviewer edits
        run: python3 review_audit/build_header_variants.py install review_audit/variants
      - name: Compile consolidated candidate with optimized and UBSan probes
        shell: bash
        run: |
          cat > review_audit/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.25)
          project(review_suggestion_AB LANGUAGES CXX)
          find_package(Kokkos CONFIG REQUIRED)
          foreach(variant IN ITEMS final_9725)
            foreach(sanitizer IN ITEMS plain ubsan)
              set(target probe_${variant}_${sanitizer})
              add_executable(${target} reviewer_policy_probe.cpp)
              target_include_directories(${target} BEFORE PRIVATE "${CMAKE_CURRENT_SOURCE_DIR}/variants/${variant}/include")
              target_link_libraries(${target} PRIVATE Kokkos::kokkos)
              target_compile_features(${target} PRIVATE cxx_std_20)
              if(sanitizer STREQUAL "ubsan")
                target_compile_options(${target} PRIVATE -O1 -g -fsanitize=signed-integer-overflow -fno-sanitize-recover=signed-integer-overflow)
                target_link_options(${target} PRIVATE -fsanitize=signed-integer-overflow)
              else()
                target_compile_options(${target} PRIVATE -O2)
              endif()
            endforeach()
          endforeach()
          EOF
          cmake -S review_audit -B build/audit -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/install"
          cmake --build build/audit --parallel 2
      - name: Assert candidate behavior (fail on unexpected regression)
        shell: bash
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          OMP_PROC_BIND: "false"
        run: |
          set -euo pipefail
          for mode in plain ubsan; do
            binary="./build/audit/probe_final_9725_${mode}"
            for case in normal pr-explicit review-noexplicit division-boundary-contract actual-md-parallel-reduce-tile1 construct-bench; do
              echo "::group::PASS expected ${mode} ${case}"
              timeout 20s "$binary" "$case"
              echo "::endgroup::"
            done
            for case in actual-product-overlimit tile-too-wide-for-int; do
              echo "::group::rejection expected ${mode} ${case}"
              set +e
              (ulimit -c 0; timeout 20s "$binary" "$case") > rejected.log 2>&1
              rc=$?
              set -e
              cat rejected.log
              if [ "$rc" -eq 0 ] || [ "$rc" -eq 124 ]; then
                echo "::error::Expected immediate rejection, got exit $rc"
                exit 1
              fi
              if ! grep -q "tile dimensions exceed int limit" rejected.log; then
                echo "::error::Expected overflow guard message was absent"
                exit 1
              fi
              if grep -qi "runtime error: signed integer overflow" rejected.log; then
                echo "::error::UBSan overflow before guard"
                exit 1
              fi
              echo "::endgroup::"
            done
          done
          echo "Consolidated #9725 candidate: expected normal results and defensive rejections verified." >> "$GITHUB_STEP_SUMMARY"
