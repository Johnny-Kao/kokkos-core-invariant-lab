name: Numerical Concurrency Audit
on:
  push:
    paths:
      - ".github/workflows/numerical-concurrency-audit.yml"
      - "numerical_concurrency_probe.cpp"
  workflow_dispatch:
jobs:
  numerical-check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: OPENMP
            compiler: g++
          - backend: THREADS
            compiler: g++
          - backend: THREADS
            compiler: clang++
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kokkos/kokkos
          ref: 1e08552799ab366f3037ce7ad46cc8d3ca85498d
          path: kokkos
          submodules: recursive
          persist-credentials: false
      - name: Build pinned Kokkos backend
        run: |
          cmake -S kokkos -B build/kokkos \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install" \
            -DKokkos_ENABLE_SERIAL=ON \
            -DKokkos_ENABLE_OPENMP=${{ matrix.backend == 'OPENMP' && 'ON' || 'OFF' }} \
            -DKokkos_ENABLE_THREADS=${{ matrix.backend == 'THREADS' && 'ON' || 'OFF' }} \
            -DKokkos_ENABLE_TESTS=OFF -DKokkos_ENABLE_EXAMPLES=OFF
          cmake --build build/kokkos --parallel 2
          cmake --install build/kokkos
      - name: Build diagnostic executable
        run: |
          mkdir -p audit
          cp numerical_concurrency_probe.cpp audit/
          cat > audit/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.25)
          project(kokkos_numeric_audit LANGUAGES CXX)
          find_package(Kokkos CONFIG REQUIRED)
          add_executable(numerical_concurrency_probe numerical_concurrency_probe.cpp)
          target_link_libraries(numerical_concurrency_probe PRIVATE Kokkos::kokkos)
          target_compile_features(numerical_concurrency_probe PRIVATE cxx_std_20)
          target_compile_options(numerical_concurrency_probe PRIVATE -O2)
          EOF
          cmake -S audit -B build/audit -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/install"
          cmake --build build/audit --parallel 2
      - name: Batch test all numeric and concurrency modes
        shell: bash
        env:
          OMP_PROC_BIND: "false"
        run: |
          set +e
          printf 'backend,compiler,family,origin,threads,tile,round,exit_code\n' > numerical-results.csv
          for family in range mdrange; do
            for origin in baseline boundary; do
              for threads in 1 2 4 8; do
                for tile in 1 4; do
                  for round in 1 2 3; do
                    echo "::group::${{ matrix.backend }} $family $origin threads=$threads tile=$tile round=$round"
                    timeout 5s ./build/audit/numerical_concurrency_probe "$family" "$origin" "$threads" "$tile"
                    rc=$?
                    echo "${{ matrix.backend }},${{ matrix.compiler }},$family,$origin,$threads,$tile,$round,$rc" >> numerical-results.csv
                    echo "::endgroup::"
                  done
                done
              done
            done
          done
          cat numerical-results.csv >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numerical-results-${{ matrix.backend }}-${{ matrix.compiler }}
          path: numerical-results.csv
