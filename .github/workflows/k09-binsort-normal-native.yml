name: "K09 private normal BinSort reuse - native ASan"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: k09-binsort-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "4"
      OMP_DYNAMIC: "FALSE"
      ASAN_OPTIONS: "halt_on_error=1:detect_leaks=0:abort_on_error=1:print_stacktrace=1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kokkos/kokkos
          ref: e9e05d0ec9fd9ed215d761c34bc0dc42ee4248c1
          path: kokkos-source
          persist-credentials: false
      - name: Build exact current upstream develop Kokkos OpenMP
        run: |
          cmake -S kokkos-source -B build/kokkos -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install" \
            -DKokkos_ENABLE_OPENMP=ON -DKokkos_ENABLE_SERIAL=ON \
            -DKokkos_ENABLE_TESTS=OFF -DKokkos_ENABLE_EXAMPLES=OFF
          cmake --build build/kokkos --parallel 2
          cmake --install build/kokkos
      - name: Build isolated real public-API ASan probe
        run: |
          cmake -S research/k09 -B build/k09 -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/install"
          cmake --build build/k09 --parallel 2
      - name: K09-A aligned ranges control
        run: |
          timeout 15s ./build/k09/k09_binsort_offset aligned 2>&1 | tee k09-offset-aligned.log
          grep 'K09_ALIGNED_PASS' k09-offset-aligned.log
      - name: K09-A different valid range offsets - silent wrong write
        run: |
          timeout 15s ./build/k09/k09_binsort_offset silent 2>&1 | tee k09-offset-silent.log
          grep 'K09_SILENT_WRONG_RANGE_OBSERVED' k09-offset-silent.log
      - name: K09-A shorter destination - same write-back index ASan OOB
        run: |
          set +e
          timeout 15s ./build/k09/k09_binsort_offset oob > k09-offset-oob.log 2>&1
          rc=$?
          set -e
          cat k09-offset-oob.log
          echo "K09_OFFSET_OOB_EXIT=$rc" | tee -a k09-offset-oob.log
          if [[ "$rc" -eq 0 ]]; then echo "K09_OFFSET_OOB_NOT_REPRODUCED"; exit 1; fi
          if ! grep -q 'heap-buffer-overflow' k09-offset-oob.log; then echo "K09_OFFSET_OOB_UNCLASSIFIED"; exit 1; fi
          echo "K09_OFFSET_NATIVE_ASAN_RED"
      - name: Control - rebuild sorter for changed keys
        run: |
          timeout 15s ./build/k09/k09_binsort_reuse control 2>&1 | tee k09-control.log
      - name: RED candidate - reuse sorter with changed keys
        run: |
          set +e
          timeout 15s ./build/k09/k09_binsort_reuse reuse > k09-reuse.log 2>&1
          rc=$?
          set -e
          cat k09-reuse.log
          echo "K09_REUSE_EXIT=$rc" | tee -a k09-reuse.log
          echo "K09 control=PASS; same sorter reused exit=$rc" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$rc" -eq 0 ]]; then
            echo "K09_RED_NOT_REPRODUCED"
            exit 1
          fi
          if ! grep -Eq 'heap-buffer-overflow|array bounds error|K09_PERM_MISMATCH' k09-reuse.log; then
            echo "K09_FAILURE_UNCLASSIFIED"
            exit 1
          fi
          echo "K09_RED_REPRODUCED"
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k09-private-native-asan-logs
          path: k09-*.log
          if-no-files-found: warn
