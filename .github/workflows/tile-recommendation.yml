name: Verify pre-existing MDRange tile recommendation fix

on:
  push:
    paths:
      - ".github/workflows/tile-recommendation.yml"
      - "tile_recommendation/probe.cpp"
      - "tile_recommendation/CMakeLists.txt"
      - "candidate/tilesize-recommendation-bounded-product.patch"
  workflow_dispatch:

jobs:
  before-after-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        revision:
          - label: pre-9650
            ref: 675433c879a1a19ecf48338a727d16b8bfbf8ff9
          - label: post-9650
            ref: 1e08552799ab366f3037ce7ad46cc8d3ca85498d
    name: ${{ matrix.compiler }} / ${{ matrix.revision.label }}
    steps:
      - name: Checkout research probe
        uses: actions/checkout@v4
      - name: Checkout pinned upstream Kokkos (no writes back to upstream)
        uses: actions/checkout@v4
        with:
          repository: kokkos/kokkos
          ref: ${{ matrix.revision.ref }}
          path: kokkos
          submodules: recursive
          persist-credentials: false
      - name: Configure Kokkos Serial backend
        run: |
          cmake -S kokkos -B build/kokkos \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install" \
            -DKokkos_ENABLE_SERIAL=ON \
            -DKokkos_ENABLE_OPENMP=OFF \
            -DKokkos_ENABLE_TESTS=OFF \
            -DKokkos_ENABLE_EXAMPLES=OFF
      - name: Build and install unpatched Kokkos
        run: |
          cmake --build build/kokkos --parallel 2
          cmake --install build/kokkos
      - name: Build sanitizer probe
        run: |
          cmake -S tile_recommendation -B build/probe \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/install"
          cmake --build build/probe --parallel 2
      - name: Verify unpatched ordinary range
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./build/probe/tile_recommendation_probe
      - name: Confirm unpatched legal boundary fails specifically in recommender
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          set +e
          ./build/probe/tile_recommendation_probe --boundary > unpatched.log 2>&1
          code=$?
          set -e
          cat unpatched.log
          test "$code" -ne 0
          grep -F "signed integer overflow: 2147483646 * 2" unpatched.log
      - name: Apply only one-line recommender candidate
        run: |
          git -C kokkos apply --check "$GITHUB_WORKSPACE/candidate/tilesize-recommendation-bounded-product.patch"
          git -C kokkos apply "$GITHUB_WORKSPACE/candidate/tilesize-recommendation-bounded-product.patch"
          git -C kokkos diff --check
          git -C kokkos diff --stat
      - name: Rebuild and reinstall patched Kokkos
        run: |
          cmake --build build/kokkos --parallel 2
          cmake --install build/kokkos
          cmake --build build/probe --clean-first --parallel 2
      - name: Verify patched ordinary range
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./build/probe/tile_recommendation_probe
      - name: Verify patched legal boundary with sanitizer
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          ./build/probe/tile_recommendation_probe --boundary
          echo "PASS: old revision ${{ matrix.revision.label }}, compiler ${{ matrix.compiler }}: same input fails pre-fix and passes after 1-line fix" >> "$GITHUB_STEP_SUMMARY"
